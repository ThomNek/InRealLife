name: treasure_irl
description: "Treasure IRL — Kết nối qua trải nghiệm thật."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  # shared_preferences dùng trong test setup (SharedPreferences.setMockInitialValues)
  # và cần khai báo ở đây để có mặt khi build release (dev_dependencies không được
  # đóng gói vào release build).
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/banners/
    - assets/images/icons/
    - assets/images/logos/
    - assets/images/avatars/
